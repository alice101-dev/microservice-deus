image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
environment: staging
partOf: deus
port: 3000
logLevel: info
replicas: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi
env: {}
envFrom: []
telemetry:
  endpoint: http://otel-collector.monitoring.svc.cluster.local.:4318
  metricExportIntervalMs: 30000
shutdown:
  drainMs: 5000
  flushMs: 5000
  terminationGracePeriodSeconds: 30
route:
  enabled: false
  pathPrefix: ""
  gateway:
    name: edge
    namespace: kgateway-system
    sectionName: http
networkPolicy:
  enabled: true
  gatewayNamespace: kgateway-system
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
