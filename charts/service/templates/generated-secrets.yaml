{{- range .Values.generatedSecrets }}
{{- $name := printf "%s-%s" (include "service.name" $) .name }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  length: {{ .length | default 48 }}
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        value: {{ "\"{{ .password }}\"" }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
{{- end }}
