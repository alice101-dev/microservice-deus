{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ required "route.pathPrefix is required when route.enabled" .Values.route.pathPrefix }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "service.name" . }}
          port: 80
          weight: 1
{{- end }}
